<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Applied before the stylesheet loads, so the page never flashes
        // the wrong theme on load.
        (function () {
            try {
                var t = localStorage.getItem('modes_logger_theme') || 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flights</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            font-size: 12px;
        }
        h1 {
            text-align: center;
            color: var(--header-bg);
        }
        .subtitle {
            text-align: center;
            font-size: 11px;
            color: var(--subtitle-text);
            margin-top: -8px;
        }
        #qnh-status {
            text-align: center;
            font-size: 11px;
            margin-top: -6px;
        }
        #qnh-status.in-use {
            color: var(--success-text);
        }
        #qnh-status.timeout {
            color: var(--warning-text);
        }
        .table-wrapper {
            overflow: auto;
            margin-top: 20px;
            max-height: calc(100vh - 140px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 4px 6px;
            text-align: center;
            border: 1px solid var(--border);
        }
        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        tr:nth-child(even) {
            background-color: var(--row-alt-bg);
        }
        tr.mil-alert {
            background-color: var(--mil-bg);
        }
        tr.gov-alert {
            background-color: var(--gov-bg);
        }
        tr.civ-alert {
            background-color: var(--civ-bg);
        }
        tr.eastern-alert {
            background-color: var(--eastern-bg);
        }
        .numbering {
            width: 50px;
        }
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 1;
            background-color: var(--bg);
        }
        tr:nth-child(even) .sticky-col {
            background-color: var(--row-alt-bg);
        }
        tr.mil-alert .sticky-col {
            background-color: var(--mil-bg);
        }
        tr.gov-alert .sticky-col {
            background-color: var(--gov-bg);
        }
        tr.civ-alert .sticky-col {
            background-color: var(--civ-bg);
        }
        tr.eastern-alert .sticky-col {
            background-color: var(--eastern-bg);
        }
        th.sticky-col {
            z-index: 3;
            background-color: var(--header-bg);
            color: var(--header-text);
        }
        th[data-sort] {
            cursor: pointer;
        }
        th[data-sort]:hover {
            text-decoration: underline;
        }
        .flagged-filter {
            margin: 10px 0 4px 0;
            font-size: 12px;
        }
        .flagged-filter label {
            cursor: pointer;
        }
        /* "Flight strip" style: bigger, easier-to-scan rows for the small
           number of aircraft typically shown when "Show only flagged" is
           on. Column headers and row coloring are untouched - only the
           data cells get bigger. */
        table.big-rows tbody td {
            font-size: 20px;
            padding: 11px 10px;
        }
        /* A small gap between the sticky header and the first flight strip,
           so a flagged row's color (e.g. the light-blue military highlight)
           doesn't sit flush against the header and get mistaken for it at a
           glance. Only the first row needs it - a themed border-top "wins"
           over the header's own thin bottom border under border-collapse,
           without disturbing spacing between the rows themselves. */
        table.big-rows tbody tr:first-child td {
            border-top: 10px solid var(--bg);
        }
        /* Squawk alarm (7500/7600/7700): cell-only, deliberately not a row
           color - it's independent of Mil/Gov/Civ/eastern watchlist status
           (see is_squawk_alarm server-side), so it has to stay visible and
           distinct no matter what row color, if any, it's sitting on top
           of. Blinks between --squawk-alarm-bg and the darker -bg-dim
           (never fading to the row's own background) at a slow ~1s cycle,
           well under the flash rate associated with photosensitive
           triggers; prefers-reduced-motion turns the blink off entirely
           and falls back to the plain static highlight. */
        .squawk-alarm-cell {
            background-color: var(--squawk-alarm-bg);
            color: var(--squawk-alarm-text);
            font-weight: bold;
            animation: squawk-blink 1s steps(1, end) infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .squawk-alarm-cell {
                animation: none;
            }
        }
        @keyframes squawk-blink {
            50% {
                background-color: var(--squawk-alarm-bg-dim);
            }
        }
    </style>
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    <a href="{{ url_for('home') }}" class="nav-button" title="Open Search page">Search</a>
    <h1>MODE-S & ADS-B Live Flights</h1>
    <p class="subtitle" id="status">Loading…</p>
    <p id="qnh-status"></p>
    <div class="flagged-filter">
        <label><input type="checkbox" id="flagged-only"> Show only flagged</label>
    </div>
    <div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th class="numbering">#</th>
                <th class="sticky-col" data-sort="registration">Registration</th>
                <th data-sort="icao24">ICAO24</th>
                <th>Callsign</th>
                <th>Type</th>
                <th>Squawk</th>
                <th data-sort="altitude">Altitude</th>
                <th data-sort="selected_altitude">Selected Alt</th>
                <th data-sort="vertical_rate">Vert Rate</th>
                <th>Track</th>
                <th>Speed</th>
                <th>Lat/Lon</th>
                <th data-sort="distance">Distance (NM)</th>
            </tr>
        </thead>
        <tbody id="live-tbody">
        </tbody>
    </table>
    </div>

    <script>
        const REFRESH_MS = {{ refresh_ms }};
        const SORT_LABELS = { registration: 'Registration', icao24: 'ICAO24', altitude: 'Altitude', vertical_rate: 'Vert Rate', selected_altitude: 'Selected Alt', distance: 'Distance (NM)' };

        // Reference point for the Distance column: EFHK (Helsinki-Vantaa)
        // airport reference point, in decimal degrees.
        const EFHK_LAT = 60.3172;
        const EFHK_LON = 24.9633;
        const EARTH_RADIUS_NM = 3440.065;

        // Transition altitude (feet), used by both the Altitude and Selected
        // Alt columns: above it, shown as a flight level ("F370"); below it,
        // shown as exact feet for Altitude ("2800") or as a QNH altitude for
        // Selected Alt ("A023"). The raw "alts" (MCP/FCU selected altitude)
        // value is also noisy (e.g. 36992, 3008, 18016 instead of a round
        // number), so it's rounded to the nearest 100ft first.
        const TRANSITION_ALTITUDE_FT = 5000;

        // QNH altitude correction: raw altitude from the feed is always
        // pressure altitude (referenced to the standard 1013.25 hPa), so
        // below the transition altitude it's corrected against the
        // server's latest known EFHK QNH to show a realistic altitude.
        // 27 ft per hPa is the standard-atmosphere-derived figure (not the
        // rounded "30 ft/hPa" pilot mental-math shortcut). Selected Alt is
        // deliberately left uncorrected - it's the pilot's own MCP/FCU
        // target, not a sensor reading.
        const QNH_STD_HPA = 1013.25;
        const QNH_FT_PER_HPA = 27;

        // Default: lowest altitude on top when the page is first opened.
        let sortState = { key: 'altitude', dir: 'asc' };
        let currentData = [];
        let currentQnh = { hpa: null, status: 'timeout', updated_utc: null };
        let flaggedOnly = false;

        function applyFlaggedFilter(data) {
            if (!flaggedOnly) return data;
            // A squawk alarm always counts as "flagged" here too, even for
            // an aircraft with no watchlist entry at all (ac.alert null) -
            // otherwise it would be invisible while this filter is on,
            // which defeats the point of the alarm.
            return data.filter(ac => ac.alert === 'mil' || ac.alert === 'gov' || ac.alert === 'civ' || ac.alert === 'eastern' || ac.squawk_alarm);
        }

        function cell(value, className) {
            const td = document.createElement('td');
            td.textContent = (value === null || value === undefined) ? '' : value;
            if (className) td.className = className;
            return td;
        }

        function formatSelectedAltitude(value) {
            if (value === null || value === undefined || value === '') return '';
            const rounded = Math.round(value / 100) * 100;
            const level = Math.round(Math.abs(rounded) / 100);
            const sign = rounded < 0 ? '-' : '';
            const label = rounded >= TRANSITION_ALTITUDE_FT ? 'F' : 'A';
            return sign + label + String(level).padStart(3, '0');
        }

        // Corrects a raw (pressure) altitude against the current QNH, when
        // a usable one is available and the aircraft is below the
        // transition altitude - above it, altitude is always shown/flown
        // as a flight level regardless of QNH, so it's returned unchanged.
        // Called once per aircraft per refresh (see refresh()) so both
        // rendering and sorting see the same corrected value.
        function correctedAltitude(rawFt, qnh) {
            if (rawFt === null || rawFt === undefined || rawFt === '') return rawFt;
            if (rawFt >= TRANSITION_ALTITUDE_FT) return rawFt;
            if (!qnh || qnh.status !== 'in_use' || qnh.hpa === null || qnh.hpa === undefined) return rawFt;
            return Math.round(rawFt + (qnh.hpa - QNH_STD_HPA) * QNH_FT_PER_HPA);
        }

        function formatAltitude(value) {
            if (value === null || value === undefined || value === '') return '';
            // Above the transition altitude, show a flight level (e.g. F370);
            // below it, show the exact altitude in feet (e.g. 2800) as before.
            if (value >= TRANSITION_ALTITUDE_FT) {
                const level = Math.round(value / 100);
                return 'F' + String(level).padStart(3, '0');
            }
            return String(value);
        }

        function formatLatLon(lat, lon) {
            if (lat === null || lat === undefined || lat === '' || lon === null || lon === undefined || lon === '') return '';
            return lat.toFixed(3) + ' ' + lon.toFixed(3);
        }

        // Great-circle distance from EFHK, in nautical miles. Returns null
        // when the aircraft's position isn't known yet, same as the other
        // still-blank fields, so it sorts to the bottom like they do.
        function distanceFromEfhkNm(lat, lon) {
            if (lat === null || lat === undefined || lat === '' || lon === null || lon === undefined || lon === '') return null;
            const toRad = d => d * Math.PI / 180;
            const dLat = toRad(lat - EFHK_LAT);
            const dLon = toRad(lon - EFHK_LON);
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(toRad(EFHK_LAT)) * Math.cos(toRad(lat)) * Math.sin(dLon / 2) ** 2;
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return EARTH_RADIUS_NM * c;
        }

        function formatDistance(value) {
            if (value === null || value === undefined || value === '') return '';
            return value.toFixed(1);
        }

        function compareValues(a, b, key) {
            const va = a[key];
            const vb = b[key];
            const aBlank = (va === null || va === undefined || va === '');
            const bBlank = (vb === null || vb === undefined || vb === '');
            // Unknown values always sort to the bottom, in either direction,
            // so they don't jump to the top just because a direction flipped.
            if (aBlank && bBlank) return 0;
            if (aBlank) return 1;
            if (bBlank) return -1;
            if (key === 'altitude' || key === 'vertical_rate' || key === 'selected_altitude' || key === 'distance') {
                return va - vb;
            }
            return String(va).localeCompare(String(vb), undefined, { numeric: true, sensitivity: 'base' });
        }

        function sortData(data) {
            const withBlanks = data.filter(ac => {
                const v = ac[sortState.key];
                return v === null || v === undefined || v === '';
            });
            const withValues = data.filter(ac => !withBlanks.includes(ac));
            withValues.sort((a, b) => {
                const cmp = compareValues(a, b, sortState.key);
                return sortState.dir === 'asc' ? cmp : -cmp;
            });
            return withValues.concat(withBlanks);
        }

        // Squawk-alarm aircraft (see squawk-alarm-cell) always render first,
        // regardless of the column/direction currently selected for
        // everything else - on a small screen, a handful of extra rows can
        // easily push an emergency squawk below the fold, and that's exactly
        // the case this exists to prevent. Within that pinned group the
        // order is always altitude ascending (lowest first, unknown
        // altitude last within the group but still above every non-alarm
        // row) - fixed, not affected by clicking the Altitude header or any
        // other column, same reasoning as why it's pinned at all: it
        // shouldn't depend on what the rest of the table happens to be
        // sorted by right now. Everything else keeps sorting exactly as
        // before via sortData().
        function sortForDisplay(data) {
            const alarmRows = data.filter(ac => ac.squawk_alarm);
            const restRows = data.filter(ac => !ac.squawk_alarm);
            alarmRows.sort((a, b) => compareValues(a, b, 'altitude'));
            return alarmRows.concat(sortData(restRows));
        }

        function updateHeaderIndicators() {
            document.querySelectorAll('th[data-sort]').forEach(th => {
                const key = th.dataset.sort;
                const arrow = sortState.key === key ? (sortState.dir === 'asc' ? ' ▲' : ' ▼') : '';
                th.textContent = SORT_LABELS[key] + arrow;
            });
        }

        function renderRows(aircraft) {
            const tbody = document.getElementById('live-tbody');
            tbody.innerHTML = '';
            aircraft.forEach((ac, i) => {
                const tr = document.createElement('tr');
                if (ac.alert === 'mil') {
                    tr.className = 'mil-alert';
                } else if (ac.alert === 'gov') {
                    tr.className = 'gov-alert';
                } else if (ac.alert === 'civ') {
                    tr.className = 'civ-alert';
                } else if (ac.alert === 'eastern') {
                    tr.className = 'eastern-alert';
                }
                tr.appendChild(cell(i + 1));
                tr.appendChild(cell(ac.registration, 'sticky-col'));
                tr.appendChild(cell(ac.icao24));
                tr.appendChild(cell(ac.callsign));
                tr.appendChild(cell(ac.type));
                tr.appendChild(cell(ac.squawk, ac.squawk_alarm ? 'squawk-alarm-cell' : null));
                tr.appendChild(cell(formatAltitude(ac.altitude)));
                tr.appendChild(cell(formatSelectedAltitude(ac.selected_altitude)));
                tr.appendChild(cell(ac.vertical_rate));
                tr.appendChild(cell(ac.track));
                tr.appendChild(cell(ac.speed));
                tr.appendChild(cell(formatLatLon(ac.lat, ac.lon)));
                tr.appendChild(cell(formatDistance(ac.distance)));
                tbody.appendChild(tr);
            });
        }

        let lastUpdatedUtc = null;

        function renderCurrent() {
            renderRows(sortForDisplay(applyFlaggedFilter(currentData)));
        }

        function updateStatus() {
            if (lastUpdatedUtc === null) return;
            const status = document.getElementById('status');
            if (flaggedOnly) {
                const flaggedCount = applyFlaggedFilter(currentData).length;
                status.textContent = flaggedCount
                    ? flaggedCount + ' flagged aircraft — last updated ' + lastUpdatedUtc + ' UTC'
                    : 'No flagged aircraft currently in range — last updated ' + lastUpdatedUtc + ' UTC';
            } else {
                status.textContent = currentData.length + ' aircraft — last updated ' + lastUpdatedUtc + ' UTC';
            }
        }

        function updateQnhStatus() {
            const el = document.getElementById('qnh-status');
            if (currentQnh.status === 'in_use') {
                el.textContent = 'Altitude correction in use (QNH ' + currentQnh.hpa + ' hPa)';
                el.className = 'in-use';
            } else {
                el.textContent = 'Altitude correction timeout';
                el.className = 'timeout';
            }
        }

        async function refresh() {
            const status = document.getElementById('status');
            try {
                const res = await fetch('/api/liveflights');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                currentData = data.aircraft;
                currentQnh = data.qnh || { hpa: null, status: 'timeout', updated_utc: null };
                // Precomputed once per refresh so sortData/compareValues can
                // treat "distance"/"altitude" like any other numeric field
                // on ac, and so rendering and sorting always agree.
                currentData.forEach(ac => {
                    ac.distance = distanceFromEfhkNm(ac.lat, ac.lon);
                    ac.altitude = correctedAltitude(ac.altitude, currentQnh);
                });
                lastUpdatedUtc = data.updated_utc;
                renderCurrent();
                updateStatus();
                updateQnhStatus();
            } catch (err) {
                status.textContent = 'Update failed: ' + err.message;
            }
        }

        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                if (sortState.key === key) {
                    sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
                } else {
                    sortState.key = key;
                    sortState.dir = 'asc';
                }
                updateHeaderIndicators();
                renderCurrent();
            });
        });

        document.getElementById('flagged-only').addEventListener('change', function () {
            flaggedOnly = this.checked;
            document.querySelector('table').classList.toggle('big-rows', flaggedOnly);
            renderCurrent();
            updateStatus();
        });

        updateHeaderIndicators();
        refresh();
        setInterval(refresh, REFRESH_MS);
    </script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
